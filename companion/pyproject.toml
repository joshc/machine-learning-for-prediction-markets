[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-lab"
version = "0.1.0"
description = "Offline educational forecasting and conservative paper-market mechanics"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prediction_market_lab = ["py.typed"]
