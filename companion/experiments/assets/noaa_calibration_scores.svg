<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc">
<title id="title">NOAA monthly-rise forecast calibration and Brier scores</title>
<desc id="desc">Original descriptive figure from the frozen final-vintage NOAA study. Five-bin primary calibration, with counts beside nonempty bins; primary and refitted sensitivity single-YES Brier scores. No confidence intervals or trading evidence.</desc>
<rect width="1020" height="560" fill="white"/>
